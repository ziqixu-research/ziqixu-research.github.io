<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" font-family="Helvetica, Arial, sans-serif">
  <!-- J. Pain 2025: measuring movement-evoked pain with digital technology -->
  <rect width="1000" height="1000" fill="#fbf8f6"/>
  <!-- walking figure -->
  <g stroke="#3b3442" stroke-width="18" stroke-linecap="round" fill="none">
    <circle cx="200" cy="150" r="42" fill="#3b3442" stroke="none"/>
    <path d="M200 200 L190 330"/>
    <path d="M195 230 L130 290"/>
    <path d="M195 230 L265 275"/>
    <path d="M190 330 L130 430"/>
    <path d="M190 330 L250 425"/>
  </g>
  <!-- wrist sensor -->
  <rect x="245" y="258" width="40" height="30" rx="8" fill="#3f8f8b"/>
  <!-- pain spark at lower back -->
  <g stroke="#c75c8a" stroke-width="7" stroke-linecap="round">
    <line x1="215" y1="300" x2="255" y2="285"/>
    <line x1="218" y1="315" x2="262" y2="318"/>
    <line x1="214" y1="330" x2="250" y2="350"/>
  </g>
  <!-- phone pain rating -->
  <rect x="640" y="90" width="200" height="340" rx="30" fill="#3b3442"/>
  <rect x="658" y="125" width="164" height="270" rx="12" fill="#fff"/>
  <text x="740" y="170" text-anchor="middle" font-size="22" font-weight="700" fill="#3b3442">Pain when</text>
  <text x="740" y="198" text-anchor="middle" font-size="22" font-weight="700" fill="#3b3442">moving</text>
  <rect x="678" y="235" width="124" height="18" rx="9" fill="#fde2e4"/>
  <rect x="678" y="235" width="84" height="18" rx="9" fill="#c75c8a"/>
  <circle cx="762" cy="244" r="16" fill="#fff" stroke="#c75c8a" stroke-width="6"/>
  <text x="740" y="300" text-anchor="middle" font-size="44" font-weight="700" fill="#c75c8a">6/10</text>
  <rect x="690" y="340" width="100" height="28" rx="14" fill="#3f8f8b"/>
  <!-- activity trace with pain markers -->
  <rect x="80" y="520" width="840" height="400" rx="24" fill="#fff" stroke="#d9d2d6" stroke-width="4"/>
  <text x="120" y="575" font-size="26" font-weight="700" fill="#3b3442">Activity</text>
  <g fill="#3f8f8b">
    <rect x="130" y="760" width="26" height="90" rx="6"/><rect x="170" y="700" width="26" height="150" rx="6"/>
    <rect x="210" y="640" width="26" height="210" rx="6"/><rect x="250" y="720" width="26" height="130" rx="6"/>
    <rect x="290" y="790" width="26" height="60" rx="6"/><rect x="330" y="680" width="26" height="170" rx="6"/>
    <rect x="370" y="620" width="26" height="230" rx="6"/><rect x="410" y="700" width="26" height="150" rx="6"/>
    <rect x="450" y="800" width="26" height="50" rx="6"/><rect x="490" y="740" width="26" height="110" rx="6"/>
    <rect x="530" y="660" width="26" height="190" rx="6"/><rect x="570" y="610" width="26" height="240" rx="6"/>
    <rect x="610" y="690" width="26" height="160" rx="6"/><rect x="650" y="780" width="26" height="70" rx="6"/>
    <rect x="690" y="720" width="26" height="130" rx="6"/><rect x="730" y="650" width="26" height="200" rx="6"/>
    <rect x="770" y="740" width="26" height="110" rx="6"/><rect x="810" y="800" width="26" height="50" rx="6"/>
  </g>
  <g fill="#c75c8a">
    <path d="M223 600 l14 24 h-28 z"/><path d="M383 580 l14 24 h-28 z"/><path d="M583 570 l14 24 h-28 z"/><path d="M743 610 l14 24 h-28 z"/>
  </g>
  <line x1="110" y1="855" x2="880" y2="855" stroke="#3b3442" stroke-width="5"/>
  <text x="500" y="895" text-anchor="middle" font-size="24" fill="#3b3442">Step count over the day · ▲ movement-evoked pain</text>
</svg>
