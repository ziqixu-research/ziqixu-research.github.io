<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" font-family="Helvetica, Arial, sans-serif">
  <!-- Neurosurgery 2026: real-time symptom + wearable monitoring -> recovery prediction -->
  <rect width="1000" height="1000" fill="#fbf8f6"/>
  <!-- smartwatch -->
  <rect x="135" y="90" width="90" height="70" rx="14" fill="#8a8fa3"/>
  <rect x="135" y="330" width="90" height="70" rx="14" fill="#8a8fa3"/>
  <rect x="90" y="150" width="180" height="190" rx="40" fill="#3b3442"/>
  <rect x="110" y="170" width="140" height="150" rx="28" fill="#e3efee"/>
  <path d="M120 250 H150 L165 210 L185 290 L200 235 L212 250 H240" fill="none" stroke="#3f8f8b" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="180" y="455" text-anchor="middle" font-size="28" font-weight="700" fill="#3b3442">Wearable</text>
  <!-- phone with symptom survey -->
  <rect x="380" y="100" width="190" height="320" rx="30" fill="#3b3442"/>
  <rect x="398" y="135" width="154" height="250" rx="12" fill="#fff"/>
  <text x="475" y="175" text-anchor="middle" font-size="22" font-weight="700" fill="#3b3442">Pain today?</text>
  <g>
    <circle cx="420" cy="215" r="12" fill="#e3efee"/><circle cx="450" cy="215" r="12" fill="#e3efee"/><circle cx="480" cy="215" r="12" fill="#fde2e4"/><circle cx="510" cy="215" r="12" fill="#e3efee"/><circle cx="540" cy="215" r="12" fill="#e3efee"/>
  </g>
  <circle cx="480" cy="215" r="12" fill="#c75c8a"/>
  <g fill="#d9d2d6">
    <rect x="415" y="255" width="120" height="12" rx="6"/>
    <rect x="415" y="285" width="95" height="12" rx="6"/>
    <rect x="415" y="315" width="110" height="12" rx="6"/>
  </g>
  <rect x="425" y="345" width="100" height="26" rx="13" fill="#c75c8a"/>
  <text x="475" y="455" text-anchor="middle" font-size="28" font-weight="700" fill="#3b3442">Daily symptoms</text>
  <!-- spine icon -->
  <g fill="#c75c8a">
    <rect x="770" y="110" width="80" height="34" rx="12"/>
    <rect x="765" y="160" width="90" height="36" rx="12"/>
    <rect x="760" y="212" width="100" height="38" rx="12"/>
    <rect x="755" y="266" width="110" height="40" rx="12"/>
    <rect x="750" y="322" width="120" height="42" rx="12"/>
  </g>
  <text x="810" y="455" text-anchor="middle" font-size="28" font-weight="700" fill="#3b3442">Spine surgery</text>
  <!-- recovery trajectory -->
  <rect x="80" y="520" width="840" height="400" rx="24" fill="#fff" stroke="#d9d2d6" stroke-width="4"/>
  <line x1="160" y1="850" x2="870" y2="850" stroke="#3b3442" stroke-width="5"/>
  <line x1="160" y1="850" x2="160" y2="580" stroke="#3b3442" stroke-width="5"/>
  <text x="515" y="895" text-anchor="middle" font-size="26" fill="#3b3442">Time after surgery</text>
  <text x="120" y="715" text-anchor="middle" font-size="26" fill="#3b3442" transform="rotate(-90 120 715)">Recovery</text>
  <line x1="300" y1="590" x2="300" y2="850" stroke="#8a8fa3" stroke-width="4" stroke-dasharray="12 10"/>
  <text x="310" y="615" font-size="22" fill="#8a8fa3">surgery</text>
  <path d="M170 760 L300 790 C 400 760, 480 700, 580 670 C 680 645, 780 630, 860 620" fill="none" stroke="#c75c8a" stroke-width="8" stroke-linecap="round"/>
  <path d="M300 790 C 400 785, 480 760, 580 745 C 680 735, 780 730, 860 728" fill="none" stroke="#8a8fa3" stroke-width="6" stroke-dasharray="14 12" stroke-linecap="round"/>
  <g fill="#3f8f8b">
    <circle cx="350" cy="772" r="9"/><circle cx="420" cy="740" r="9"/><circle cx="490" cy="705" r="9"/><circle cx="560" cy="676" r="9"/><circle cx="630" cy="660" r="9"/>
  </g>
  <text x="860" y="605" text-anchor="end" font-size="22" font-weight="700" fill="#c75c8a">with monitoring</text>
  <text x="860" y="765" text-anchor="end" font-size="22" fill="#8a8fa3">standard measures</text>
</svg>
