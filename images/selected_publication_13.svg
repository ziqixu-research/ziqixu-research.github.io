<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" font-family="Helvetica, Arial, sans-serif">
  <!-- KDD 2023: disentangled latent representation for scarcely available treatment (ECMO) decisions -->
  <rect width="1000" height="1000" fill="#fbf8f6"/>
  <!-- patient features -->
  <rect x="60" y="300" width="170" height="360" rx="24" fill="#fff" stroke="#d9d2d6" stroke-width="4"/>
  <text x="145" y="355" text-anchor="middle" font-size="26" font-weight="700" fill="#3b3442">Patient</text>
  <g fill="#8a8fa3">
    <rect x="95" y="390" width="100" height="18" rx="9"/><rect x="95" y="430" width="80" height="18" rx="9"/>
    <rect x="95" y="470" width="110" height="18" rx="9"/><rect x="95" y="510" width="70" height="18" rx="9"/>
    <rect x="95" y="550" width="95" height="18" rx="9"/><rect x="95" y="590" width="85" height="18" rx="9"/>
  </g>
  <!-- encoder trapezoid -->
  <path d="M260 330 L420 400 L420 560 L260 630 Z" fill="#3b3442"/>
  <text x="340" y="490" text-anchor="middle" font-size="24" font-weight="700" fill="#fff">enc</text>
  <!-- disentangled factors -->
  <rect x="450" y="300" width="70" height="150" rx="16" fill="#c75c8a"/>
  <rect x="450" y="510" width="70" height="150" rx="16" fill="#3f8f8b"/>
  <text x="485" y="285" text-anchor="middle" font-size="22" font-weight="700" fill="#c75c8a">z_treat</text>
  <text x="485" y="700" text-anchor="middle" font-size="22" font-weight="700" fill="#3f8f8b">z_other</text>
  <path d="M420 440 L450 375" stroke="#3b3442" stroke-width="5"/>
  <path d="M420 520 L450 585" stroke="#3b3442" stroke-width="5"/>
  <!-- latent space plot -->
  <rect x="570" y="180" width="370" height="600" rx="24" fill="#fff" stroke="#d9d2d6" stroke-width="4"/>
  <line x1="620" y1="720" x2="900" y2="720" stroke="#3b3442" stroke-width="4"/>
  <line x1="620" y1="720" x2="620" y2="240" stroke="#3b3442" stroke-width="4"/>
  <text x="760" y="760" text-anchor="middle" font-size="20" fill="#3b3442">z_other</text>
  <text x="595" y="480" text-anchor="middle" font-size="20" fill="#3b3442" transform="rotate(-90 595 480)">z_treat</text>
  <line x1="630" y1="480" x2="900" y2="480" stroke="#8a8fa3" stroke-width="3" stroke-dasharray="10 8"/>
  <g fill="#c75c8a">
    <circle cx="660" cy="300" r="12"/><circle cx="720" cy="340" r="12"/><circle cx="790" cy="290" r="12"/><circle cx="850" cy="360" r="12"/>
    <circle cx="690" cy="400" r="12"/><circle cx="760" cy="420" r="12"/><circle cx="870" cy="300" r="12"/><circle cx="820" cy="430" r="12"/>
  </g>
  <g fill="#3f8f8b">
    <circle cx="670" cy="560" r="12"/><circle cx="740" cy="530" r="12"/><circle cx="800" cy="600" r="12"/><circle cx="860" cy="550" r="12"/>
    <circle cx="700" cy="650" r="12"/><circle cx="780" cy="680" r="12"/><circle cx="850" cy="660" r="12"/><circle cx="720" cy="600" r="12"/>
  </g>
  <text x="890" y="265" text-anchor="end" font-size="20" font-weight="700" fill="#c75c8a">benefits</text>
  <text x="890" y="705" text-anchor="end" font-size="20" font-weight="700" fill="#3f8f8b">less benefit</text>
  <!-- scarce resource -->
  <rect x="160" y="820" width="680" height="110" rx="24" fill="#fde2e4"/>
  <text x="500" y="865" text-anchor="middle" font-size="28" font-weight="700" fill="#6b2a42">Scarce treatment allocation</text>
  <text x="500" y="903" text-anchor="middle" font-size="22" fill="#6b2a42">who benefits most from ECMO?</text>
</svg>
