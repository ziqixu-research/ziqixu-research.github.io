<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" font-family="Helvetica, Arial, sans-serif">
  <!-- BMJ Open 2026: protocol for personalised prediction of persistent postsurgical pain (P5) -->
  <rect width="1000" height="1000" fill="#fbf8f6"/>
  <text x="500" y="120" text-anchor="middle" font-size="40" font-weight="700" fill="#3b3442">Perioperative monitoring</text>
  <!-- timeline -->
  <line x1="110" y1="420" x2="890" y2="420" stroke="#3b3442" stroke-width="8" stroke-linecap="round"/>
  <g>
    <circle cx="160" cy="420" r="30" fill="#3f8f8b"/>
    <circle cx="400" cy="420" r="38" fill="#c75c8a"/>
    <circle cx="640" cy="420" r="30" fill="#8a8fa3"/>
    <circle cx="840" cy="420" r="30" fill="#8a8fa3"/>
  </g>
  <text x="160" y="500" text-anchor="middle" font-size="28" font-weight="700" fill="#3b3442">Pre-op</text>
  <text x="400" y="500" text-anchor="middle" font-size="28" font-weight="700" fill="#c75c8a">Surgery</text>
  <text x="640" y="500" text-anchor="middle" font-size="28" font-weight="700" fill="#3b3442">3 months</text>
  <text x="840" y="500" text-anchor="middle" font-size="28" font-weight="700" fill="#3b3442">6 months</text>
  <!-- data icons above timeline -->
  <rect x="110" y="200" width="100" height="160" rx="18" fill="#3b3442"/>
  <rect x="122" y="220" width="76" height="118" rx="6" fill="#e3efee"/>
  <g fill="#3f8f8b"><rect x="132" y="240" width="56" height="10" rx="5"/><rect x="132" y="265" width="40" height="10" rx="5"/><rect x="132" y="290" width="50" height="10" rx="5"/></g>
  <rect x="250" y="230" width="90" height="120" rx="12" fill="#fff" stroke="#d9d2d6" stroke-width="4"/>
  <g fill="#d9d2d6"><rect x="265" y="255" width="60" height="10" rx="5"/><rect x="265" y="280" width="45" height="10" rx="5"/><rect x="265" y="305" width="55" height="10" rx="5"/></g>
  <text x="295" y="385" text-anchor="middle" font-size="20" fill="#8a8fa3">EHR</text>
  <rect x="470" y="200" width="100" height="160" rx="18" fill="#3b3442"/>
  <rect x="482" y="220" width="76" height="118" rx="6" fill="#e3efee"/>
  <path d="M490 300 L510 270 L530 290 L550 250" fill="none" stroke="#3f8f8b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="520" y="385" text-anchor="middle" font-size="20" fill="#8a8fa3">EMA + sensing</text>
  <!-- outcome: persistent pain risk -->
  <rect x="80" y="580" width="840" height="340" rx="24" fill="#fff" stroke="#d9d2d6" stroke-width="4"/>
  <text x="130" y="640" font-size="28" font-weight="700" fill="#3b3442">Personalized risk of persistent pain</text>
  <g font-size="24" fill="#3b3442">
    <text x="130" y="715">Patient 1</text><text x="130" y="785">Patient 2</text><text x="130" y="855">Patient 3</text>
  </g>
  <g>
    <rect x="290" y="695" width="560" height="26" rx="13" fill="#f1ecef"/><rect x="290" y="695" width="140" height="26" rx="13" fill="#3f8f8b"/>
    <rect x="290" y="765" width="560" height="26" rx="13" fill="#f1ecef"/><rect x="290" y="765" width="420" height="26" rx="13" fill="#c75c8a"/>
    <rect x="290" y="835" width="560" height="26" rx="13" fill="#f1ecef"/><rect x="290" y="835" width="260" height="26" rx="13" fill="#d9a441"/>
  </g>
</svg>
