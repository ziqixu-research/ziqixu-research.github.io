# Curated list for the homepage “Selected projects” block, grouped by research theme.
# themes: list of { id, title, intro, items }. id is the anchor (#id) linked from Research Interests in _pages/about.md.
#         intro: one or two sentences (Markdown) shown under the theme title.
# Each item:
# image: filename only (e.g. imwut-2025.png). Put the actual file in /images/ at the site root — not in _data/.
#        Or use a full https:// URL to hotlink an image elsewhere. SVG works too.
#        Best: square PNG/JPEG/SVG, 800×800 to 1200×1200 px (matches on-page square thumb + lightbox; avoids uneven crops).
#        image_contain: true — scale image to fit inside the square without cropping (letterboxing); use for wide/short figures.
# authors: Markdown + allowed HTML (e.g. <u>Ziqi Xu</u> for underline on the homepage cards; full /publications/ page uses Xu Z from collection YAML)
# venue: Markdown (use *italics* for proceedings title)
# note_blue / note_orange: optional callout lines (Markdown)
# buttons: label + url; add style: award for red “AWARDED” style
# featured: true — also show this card in the short homepage list (the /research/ page shows every item)

themes:
  - id: uncertainty
    title: "Uncertainty Quantification & Trustworthy AI"
    intro: "Methods that let clinical models recognize when they may be wrong — from modality-specific uncertainty in multimodal fusion to uncertainty–risk alignment in language models — so predictions can be trusted, or deferred to clinicians, appropriately."
